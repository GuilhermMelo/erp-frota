<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ERP Frota</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f8fafc;
        color: #334155;
        font-family: 'Segoe UI', system-ui, sans-serif;
        user-select: none;
      }
      .caixa { text-align: center; }
      .marca { font-size: 22px; font-weight: 600; color: #0f172a; }
      .sub { margin-top: 4px; font-size: 13px; color: #94a3b8; }
      .barra {
        width: 220px;
        height: 3px;
        margin: 28px auto 0;
        border-radius: 3px;
        background: #e2e8f0;
        overflow: hidden;
      }
      /* Indeterminada de propósito: não sabemos quanto falta, e uma barra que finge
         saber (enchendo até 90% e travando) é pior do que uma que assume que não sabe. */
      .barra::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #2563eb;
        animation: desliza 1.1s ease-in-out infinite;
      }
      @keyframes desliza {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      #status { margin-top: 16px; font-size: 13px; color: #64748b; min-height: 18px; }
    </style>
  </head>
  <body>
    <div class="caixa">
      <div class="marca">GM Locações</div>
      <div class="sub">Gestão de frota</div>
      <div class="barra"></div>
      <div id="status">Iniciando…</div>
    </div>
  </body>
</html>

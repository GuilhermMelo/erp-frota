services:
  db:
    image: postgres:16-alpine
    container_name: erp-frota-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: frota
      POSTGRES_PASSWORD: frota
      POSTGRES_DB: frota
    ports:
      # 5432 e 5433 já estão ocupadas nesta máquina (Postgres local e ai-doc-postgres).
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frota -d frota"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
